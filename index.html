<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>富士山下迷妹跑腿中 - 出貨進度查詢與管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        babyblue: '#E0F2FE',
                        softblue: '#BAE6FD',
                        deepblue: '#0284C7',
                        cardbg: '#F8FAFC'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-babyblue min-h-screen flex flex-col justify-between text-slate-700">

    <!-- 頁頭 -->
    <header class="w-full py-8 px-4 text-center relative max-w-2xl mx-auto">
        <h1 class="text-2xl md:text-3xl font-bold tracking-wider text-slate-800 mb-2">富士山下迷妹跑腿中</h1>
        <p class="text-sm md:text-base text-slate-600">出貨進度與順序查詢</p>
        
        <!-- 管理後台開關按鈕 -->
        <button onclick="toggleAdminPanel()" class="absolute top-6 right-4 text-xs bg-white/80 hover:bg-white text-slate-600 border border-sky-200 px-3 py-1.5 rounded-xl shadow-sm transition">
            ⚙️ 後台管理
        </button>
    </header>

    <main class="container mx-auto px-4 max-w-2xl mb-auto space-y-6">

        <!-- 前台：買家查詢區 -->
        <div class="bg-white rounded-2xl shadow-md p-6 md:p-8 border border-sky-100">
            <label for="searchInput" class="block text-sm font-medium text-slate-600 mb-2">請輸入您的 LINE 名字：</label>
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="輸入名字..." 
                    class="flex-1 px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-softblue text-slate-700 bg-cardbg">
                <button onclick="searchData()" 
                    class="bg-deepblue hover:bg-sky-600 text-white px-6 py-3 rounded-xl font-medium transition shadow-sm">
                    查詢
                </button>
            </div>
        </div>

        <!-- 查詢結果顯示區 -->
        <div id="resultContainer" class="space-y-4">
            <div class="text-center py-10 text-slate-400 bg-white/50 rounded-2xl border border-dashed border-sky-200">
                請於上方輸入名字開始查詢您的進度與順序
            </div>
        </div>

        <!-- 後台：園長專屬管理區 (預設隱藏) -->
        <div id="adminPanel" class="hidden bg-white rounded-2xl shadow-xl p-6 border-2 border-sky-300 space-y-6">
            <div class="flex justify-between items-center border-b pb-3">
                <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                    🛠️ 後台控制台 
                    <span class="text-xs font-normal text-slate-400">(順位可自由調整)</span>
                </h2>
                <button onclick="resetData()" class="text-xs text-red-400 hover:text-red-600 underline">重置所有資料</button>
            </div>

            <!-- 新增買家資料區 -->
            <form onsubmit="addNewItem(event)" class="bg-sky-50/60 p-4 rounded-xl space-y-3 border border-sky-100">
                <h3 class="text-sm font-bold text-slate-700">➕ 新增出貨登記</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
                    <input type="text" id="newName" placeholder="LINE 名字 *" required class="p-2.5 rounded-lg border border-slate-200">
                    <select id="newMethod" class="p-2.5 rounded-lg border border-slate-200 bg-white">
                        <option value="7-11賣貨便">7-11賣貨便</option>
                        <option value="黑貓">黑貓</option>
                        <option value="面交">面交</option>
                    </select>
                    <input type="date" id="newShipDate" class="p-2.5 rounded-lg border border-slate-200 bg-white">
                    <input type="text" id="newRemark" placeholder="備註 (如：內退運費、有鏡子)" class="p-2.5 rounded-lg border border-slate-200">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg font-medium text-sm transition shadow-sm">
                    + 確認新增資料
                </button>
            </form>

            <!-- 資料總覽與順序/狀態調整 -->
            <div>
                <h3 class="text-sm font-bold text-slate-700 mb-3">📋 買家順序與狀態管理 (可點按鈕調整順序)</h3>
                <div id="adminDataList" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
                    <!-- 動態生成管理列表 -->
                </div>
            </div>
        </div>

    </main>

    <footer class="w-full py-6 text-center text-xs text-slate-500">
        © 富士山下迷妹跑腿中 All Rights Reserved.
    </footer>

    <script>
        // 原始預設 33 筆買家資料 (照預設順序)
        const defaultShippingData = [
            { name: "琪琪", shipDate: "2026-09-13", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "魚書瑤", shipDate: "2026-09-13", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "janice", shipDate: "2026-09-13", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "moon", shipDate: "2026-09-13", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "阿尼", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "哩哩", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "iris", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "欣欣", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "亮亮", shipDate: "", quantity: 20, method: "黑貓", remark: "有鏡子" },
            { name: "毛毛", shipDate: "", quantity: 20, method: "黑貓", remark: "有鏡子" },
            { name: "胡", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "佳佳", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "sherry", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "內退運費" },
            { name: "15¨̮", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "內退運費" },
            { name: "Tiffany Sun", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "Louise🍎", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "Jennifer", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "宜蓁", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "魚‘👧🏻", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "宸宸", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "35", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "Ying", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "LIAN", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "Yi-Xuan Li（怡萱）", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "Valerie 崎妤", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "Ina", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "Lisa yu", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "內退運費" },
            { name: "chichi", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "同一樓", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "沈丸子", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "小旭" },
            { name: "佩✨ 𝓐𝓷𝓰𝓮𝓵𝓪🫧", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "小旭" },
            { name: "阿茹", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "小旭" },
            { name: "野口🐶", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "海周" }
        ];

        function getData() {
            const saved = localStorage.getItem('fuji_shipping_list_v2');
            if (saved) {
                return JSON.parse(saved);
            }
            localStorage.setItem('fuji_shipping_list_v2', JSON.stringify(defaultShippingData));
            return defaultShippingData;
        }

        function saveData(data) {
            localStorage.setItem('fuji_shipping_list_v2', JSON.stringify(data));
        }

        function toggleAdminPanel() {
            const panel = document.getElementById('adminPanel');
            if (panel.classList.contains('hidden')) {
                const pwd = prompt("請輸入管理員密碼：", "");
                if (pwd === "1239") {
                    panel.classList.remove('hidden');
                    renderAdminList();
                    panel.scrollIntoView({ behavior: 'smooth' });
                } else if (pwd !== null) {
                    alert("密碼錯誤！");
                }
            } else {
                panel.classList.add('hidden');
            }
        }

        function searchData() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';

            if (!keyword) {
                container.innerHTML = '<div class="bg-amber-50 border border-amber-200 text-amber-700 px-4 py-3 rounded-xl text-center text-sm">請輸入要查詢的名字喔！</div>';
                return;
            }

            const currentData = getData();
            // 計算前面未寄出人數
            let pendingCount = 0;
            const indexedData = currentData.map((item, index) => {
                const isShipped = item.shipDate !== "";
                if (!isShipped) pendingCount++;
                return {
                    ...item,
                    originalRank: index + 1,
                    waitingBefore: isShipped ? 0 : pendingCount - 1
                };
            });

            const results = indexedData.filter(item => item.name.toLowerCase().includes(keyword));

            if (results.length === 0) {
                container.innerHTML = '<div class="bg-white border border-slate-200 text-slate-500 p-6 rounded-2xl text-center shadow-sm">找不到符合的登記資料，請確認名字是否有誤！</div>';
                return;
            }

            results.forEach(item => {
                const isShipped = item.shipDate !== "";
                
                const statusBadge = isShipped 
                    ? `<span class="bg-emerald-100 text-emerald-700 text-xs px-3 py-1.5 rounded-full font-medium">✅ 已於 ${item.shipDate} 寄出</span>`
                    : `<span class="bg-amber-100 text-amber-700 text-xs px-3 py-1.5 rounded-full font-medium">📦 出貨準備中 (第 ${item.originalRank} 順位)</span>`;
                
                const progressStep = isShipped
                    ? `<div class="bg-emerald-50 border border-emerald-100 rounded-xl p-3 text-xs text-emerald-800 flex justify-between items-center">
                        <span>進度：包裹已寄出</span>
                        <span class="font-bold">100%</span>
                       </div>`
                    : `<div class="bg-sky-50 border border-sky-100 rounded-xl p-3 text-xs text-sky-800 space-y-1">
                        <div class="flex justify-between items-center font-bold">
                            <span>前面剩餘：${item.waitingBefore} 包打包中</span>
                            <span>順位：第 ${item.originalRank} 位</span>
                        </div>
                        <p class="text-slate-500 font-normal">全力打包中🚚</p>
                       </div>`;

                const remarkSection = item.remark ? `<div class="text-xs text-slate-500 bg-slate-50 px-3 py-2 rounded-lg">備註：${item.remark}</div>` : '';

                const card = document.createElement('div');
                card.className = "bg-white border border-sky-100 rounded-2xl p-6 shadow-sm space-y-4";
                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                        <div>
                            <span class="font-bold text-lg text-slate-800">${item.name}</span>
                            <span class="text-xs text-slate-400 block">${item.method}</span>
                        </div>
                        ${statusBadge}
                    </div>
                    ${progressStep}
                    ${remarkSection}
                `;
                container.appendChild(card);
            });
        }

        function renderAdminList() {
            const data = getData();
            const container = document.getElementById('adminDataList');
            container.innerHTML = '';

            data.forEach((item, index) => {
                const row = document.createElement('div');
                row.className = "bg-slate-50 border border-slate-200 rounded-xl p-3 flex flex-col md:flex-row justify-between items-start md:items-center gap-2 text-sm";
                
                const isShipped = item.shipDate !== "";

                row.innerHTML = `
                    <div class="flex items-center gap-2 w-full md:w-auto">
                        <span class="font-mono font-bold text-xs bg-sky-100 text-sky-700 px-2 py-1 rounded-md">#${index + 1}</span>
                        <!-- 調整順序按鈕 -->
                        <div class="flex gap-1">
                            <button onclick="moveItem(${index}, -1)" ${index === 0 ? 'disabled class="opacity-30"' : ''} class="px-1.5 py-0.5 bg-white border rounded hover:bg-slate-100 text-xs">▲</button>
                            <button onclick="moveItem(${index}, 1)" ${index === data.length - 1 ? 'disabled class="opacity-30"' : ''} class="px-1.5 py-0.5 bg-white border rounded hover:bg-slate-100 text-xs">▼</button>
                        </div>
                        <span class="font-bold text-slate-800">${item.name}</span>
                        <span class="text-xs text-slate-400">(${item.method})</span>
                        ${item.remark ? `<span class="text-xs text-sky-600 bg-sky-50 px-1.5 py-0.5 rounded">${item.remark}</span>` : ''}
                    </div>
                    
                    <div class="flex items-center gap-2 w-full md:w-auto justify-end border-t md:border-t-0 pt-2 md:pt-0">
                        <button onclick="editName(${index})" class="text-xs text-sky-600 hover:text-sky-800 underline">✏️改名</button>
                        <input type="date" value="${item.shipDate}" onchange="updateDate(${index}, this.value)" 
                            class="text-xs p-1.5 border rounded-lg bg-white border-slate-300">
                        <button onclick="toggleStatus(${index})" 
                            class="text-xs px-3 py-1.5 rounded-lg font-medium transition ${isShipped ? 'bg-emerald-500 text-white hover:bg-emerald-600' : 'bg-slate-300 text-slate-700 hover:bg-slate-400'}">
                            ${isShipped ? '已寄出' : '未寄出'}
                        </button>
                        <button onclick="deleteItem(${index})" class="text-xs text-red-500 hover:text-red-700 p-1 font-bold">✕</button>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        // 上下移動順序
        function moveItem(index, direction) {
            const data = getData();
            const targetIndex = index + direction;
            if (targetIndex < 0 || targetIndex >= data.length) return;
            
            const temp = data[index];
            data[index] = data[targetIndex];
            data[targetIndex] = temp;
            
            saveData(data);
            renderAdminList();
            const currentSearch = document.getElementById('searchInput').value.trim();
            if (currentSearch) searchData();
        }

        // 修改買家名字
        function editName(index) {
            const data = getData();
            const newName = prompt("請輸入新的 LINE 名字：", data[index].name);
            if (newName && newName.trim() !== "") {
                data[index].name = newName.trim();
                saveData(data);
                renderAdminList();
                const currentSearch = document.getElementById('searchInput').value.trim();
                if (currentSearch) searchData();
            }
        }

        function toggleStatus(index) {
            const data = getData();
            if (data[index].shipDate) {
                data[index].shipDate = "";
            } else {
                const today = new Date().toISOString().split('T')[0];
                data[index].shipDate = today;
            }
            saveData(data);
            renderAdminList();
            const currentSearch = document.getElementById('searchInput').value.trim();
            if (currentSearch) searchData();
        }

        function updateDate(index, newDate) {
            const data = getData();
            data[index].shipDate = newDate;
            saveData(data);
            renderAdminList();
            const currentSearch = document.getElementById('searchInput').value.trim();
            if (currentSearch) searchData();
        }

        function addNewItem(e) {
            e.preventDefault();
            const name = document.getElementById('newName').value.trim();
            const method = document.getElementById('newMethod').value;
            const shipDate = document.getElementById('newShipDate').value;
            const remark = document.getElementById('newRemark').value.trim();

            if (!name) return;

            const data = getData();
            data.push({ name, method, shipDate, remark, quantity: 20 });
            saveData(data);

            document.getElementById('newName').value = '';
            document.getElementById('newShipDate').value = '';
            document.getElementById('newRemark').value = '';

            renderAdminList();
            alert(`已成功新增 ${name} 至列表最後順位！`);
        }

        function deleteItem(index) {
            const data = getData();
            if (confirm(`確定要刪除「${data[index].name}」這筆資料嗎？`)) {
                data.splice(index, 1);
                saveData(data);
                renderAdminList();
                const currentSearch = document.getElementById('searchInput').value.trim();
                if (currentSearch) searchData();
            }
        }

        function resetData() {
            if (confirm("這將會清除所有調整，恢復為預設 33 筆名單，確定嗎？")) {
                localStorage.setItem('fuji_shipping_list_v2', JSON.stringify(defaultShippingData));
                renderAdminList();
                alert("已恢復預設狀態！");
            }
        }

        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { searchData(); }
        });
    </script>
</body>
</html>
