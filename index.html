<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>富士山下迷妹跑腿中- 出貨進度查詢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        babyblue: '#E0F2FE',
                        softblue: '#BAE6FD',
                        deepblue: '#0284C7',
                        cardbg: '#F8FAFC'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-babyblue min-h-screen flex flex-col justify-between text-slate-700">
    <header class="w-full py-8 px-4 text-center">
        <h1 class="text-2xl md:text-3xl font-bold tracking-wider text-slate-800 mb-2">富士山下迷妹跑腿中</h1>
        <p class="text-sm md:text-base text-slate-600">進度查詢</p>
    </header>
    <main class="container mx-auto px-4 max-w-2xl mb-auto">
        <div class="bg-white rounded-2xl shadow-md p-6 md:p-8 mb-6 border border-sky-100">
            <label for="searchInput" class="block text-sm font-medium text-slate-600 mb-2">請輸入您的 LINE 名字：</label>
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="" 
                    class="flex-1 px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-softblue text-slate-700 bg-cardbg">
                <button onclick="searchData()" 
                    class="bg-deepblue hover:bg-sky-600 text-white px-6 py-3 rounded-xl font-medium transition shadow-sm">
                    查詢
                </button>
            </div>
        </div>
        <div id="resultContainer" class="space-y-4">
            <div class="text-center py-10 text-slate-400 bg-white/50 rounded-2xl border border-dashed border-sky-200">
                請於上方輸入名字開始查詢您的進度
            </div>
        </div>
    </main>
    <footer class="w-full py-6 text-center text-xs text-slate-500">
        © 富士山下迷妹跑腿中 All Rights Reserved.
    </footer>
    <script>

            { name: "janice", shipDate: "2026-09-13", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "moon", shipDate: "2026-09-13", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "阿尼", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "哩哩", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "iris", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "欣欣", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "亮亮", shipDate: "", quantity: 20, method: "黑貓", remark: "有鏡子" },
            { name: "毛毛", shipDate: "", quantity: 20, method: "黑貓", remark: "有鏡子" },
            { name: "胡", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "佳佳", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "sherry", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "內退運費" },
            { name: "15¨̮", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "內退運費" },
            { name: "Tiffany Sun", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "Louise🍎", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "Jennifer", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "宜蓁", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "魚‘👧🏻", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "宸宸", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "35", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },

            { name: "Yi-Xuan Li（怡萱）", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "Valerie 崎妤", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "Ina", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "Lisa yu", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "內退運費" },
            { name: "chichi", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "同一樓", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "" },
            { name: "沈丸子", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "小旭" },
            { name: "佩✨ 𝓐𝓷𝓰𝓮𝓵𝓪🫧", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "小旭" },
            { name: "阿茹", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "小旭" },
            { name: "野口🐶", shipDate: "", quantity: 20, method: "7-11賣貨便", remark: "海周" }
        ];
        document.getElementById('searchInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { searchData(); }
        });
        function searchData() {
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            const container = document.getElementById('resultContainer');
            container.innerHTML = '';
            if (!keyword) {
                container.innerHTML = '<div class="bg-amber-50 border border-amber-200 text-amber-700 px-4 py-3 rounded-xl text-center text-sm">請輸入要查詢的名字喔！</div>';
                return;
            }
            const results = shippingData.filter(item => item.name.toLowerCase().includes(keyword));
            if (results.length === 0) {
                container.innerHTML = '<div class="bg-white border border-slate-200 text-slate-500 p-6 rounded-2xl text-center shadow-sm">找不到符合的登記資料，請確認名字是否有誤！</div>';
                return;
            }
            results.forEach(item => {
                const isShipped = item.shipDate !== "";
                const statusBadge = isShipped 
                    ? `<span class="bg-emerald-100 text-emerald-700 text-xs px-3 py-1.5 rounded-full font-medium">已於 ${item.shipDate} 寄出</span>`
                    : `<span class="bg-amber-100 text-amber-700 text-xs px-3 py-1.5 rounded-full font-medium">備貨 / 預留中</span>`;
                const remarkSection = item.remark ? `<div class="mt-2 text-xs text-sky-600 bg-sky-50 px-3 py-2 rounded-lg">備註：${item.remark}</div>` : '';
                const card = document.createElement('div');
                card.className = "bg-white border border-sky-100 rounded-2xl p-6 shadow-sm space-y-3";
                card.innerHTML = `
                    <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                        <span class="font-bold text-lg text-slate-800">${item.name}</span>
                        ${statusBadge}
                    </div>
                    <div class="grid grid-cols-2 gap-2 text-sm text-slate-600">
                        <div><span class="text-slate-400">寄送方式：</span> ${item.method}</div>
                    </div>
                    ${remarkSection}
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
